<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="#f8f5ef"/><rect x="30" y="30" width="734" height="1063" fill="none" stroke="#bdc2c1" stroke-width="3"/><text x="65" y="85" fill="#5a6a6d" font-family="Georgia,serif" font-size="27">L’Atelier des Papiers</text><text x="65" y="134" fill="#35495b" font-family="Georgia,serif" font-size="39">TAGS GIVRÉS</text><text x="65" y="175" fill="#66717a" font-family="Arial,sans-serif" font-size="20">Trois étiquettes hivernales • 7 × 12 cm chacune</text><g>
<rect x="56" y="191" width="683" height="130" rx="12" fill="#e4e9e9"/>
<path d="M223 203H297L317 223V306H205V223Z" fill="#8faabd" stroke="#8a9699" stroke-width="2"/><circle cx="261" cy="222" r="5" fill="#f9f6ee" stroke="#9a978d" stroke-width="2"/><path d="M261 265v30M261 275l-18-10M261 283l20-14" stroke="#f8fcff" stroke-width="3" fill="none"/><path d="M261 222q-30-24 0-24q33-3 0 24" stroke="#cbb79b" stroke-width="3" fill="none"/><path d="M368 203H442L462 223V306H350V223Z" fill="#8c9ca9" stroke="#8a9699" stroke-width="2"/><circle cx="406" cy="222" r="5" fill="#f9f6ee" stroke="#9a978d" stroke-width="2"/><path d="M406 265v30M406 275l-18-10M406 283l20-14" stroke="#f8fcff" stroke-width="3" fill="none"/><path d="M406 222q-30-24 0-24q33-3 0 24" stroke="#cbb79b" stroke-width="3" fill="none"/><path d="M513 203H587L607 223V306H495V223Z" fill="#d8cdc0" stroke="#8a9699" stroke-width="2"/><circle cx="551" cy="222" r="5" fill="#f9f6ee" stroke="#9a978d" stroke-width="2"/><path d="M551 265v30M551 275l-18-10M551 283l20-14" stroke="#f8fcff" stroke-width="3" fill="none"/><path d="M551 222q-30-24 0-24q33-3 0 24" stroke="#cbb79b" stroke-width="3" fill="none"/>
</g><rect x="54" y="337" width="686" height="5" fill="#b3c2c4"/><text x="79" y="380" font-family="Arial,sans-serif" font-size="21" fill="#4a5460">1. Découper les trois tags de 7 × 12 cm</text><text x="79" y="431" font-family="Arial,sans-serif" font-size="21" fill="#4a5460">2. Perforer le trou à 10 mm du bord</text><text x="79" y="482" font-family="Arial,sans-serif" font-size="21" fill="#4a5460">3. Encrer les trois fonds en bleu, gris, ivoire</text><text x="79" y="533" font-family="Arial,sans-serif" font-size="21" fill="#4a5460">4. Ajouter quelques gouttes d’eau et sécher</text><text x="79" y="584" font-family="Arial,sans-serif" font-size="21" fill="#4a5460">5. Tamponner une silhouette de sapin</text><text x="79" y="635" font-family="Arial,sans-serif" font-size="21" fill="#4a5460">6. Embosser les flocons blancs au pistolet</text><text x="79" y="686" font-family="Arial,sans-serif" font-size="21" fill="#4a5460">7. Poser une texture neigeuse puis sécher</text><text x="79" y="737" font-family="Arial,sans-serif" font-size="21" fill="#4a5460">8. Placer les petites étiquettes</text><text x="79" y="788" font-family="Arial,sans-serif" font-size="21" fill="#4a5460">9. Fixer les rubans, photographier et ranger</text><text x="66" y="928" font-family="Georgia,serif" font-size="25" fill="#465a60">Conseils pour réussir</text><text x="67" y="967" font-family="Arial,sans-serif" font-size="18" fill="#53616a">Utiliser un pistolet chauffant de loisirs créatifs</text><text x="67" y="996" font-family="Arial,sans-serif" font-size="18" fill="#53616a">et laisser sécher les couches avant de continuer.</text><text x="67" y="1034" font-family="Arial,sans-serif" font-size="17" fill="#657475">Schéma de composition non à l’échelle 1:1.</text><text x="67" y="1065" font-family="Arial,sans-serif" font-size="17" fill="#657475">Patron vierge 7 × 12 cm disponible dans l’application.</text></svg>