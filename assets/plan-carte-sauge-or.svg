<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-label="Plan de carte botanique sauge et or, format fermé 10,5 sur 15 centimètres"><rect width="210" height="297" fill="#faf8f2"/><text x="19" y="11" font-family="Georgia,serif" font-size="6" fill="#5d614e">L’Atelier des Papiers · Sauge & or</text><text x="19" y="18" font-family="Arial,sans-serif" font-size="3.9" fill="#736f63">PLAN 1:1 DE LA FACE AVANT • Base complète : 21 × 15 cm, pli à 10,5 cm</text><rect x="20" y="25" width="105" height="150" rx="1" fill="#ede8dd" stroke="#837564" stroke-width=".6"/><rect x="25" y="30" width="95" height="140" rx=".8" fill="#9faa95" stroke="#7e907b" stroke-width=".4"/><rect x="32" y="51" width="81" height="52" fill="#ddc6ab" stroke="#a98a72" stroke-width=".4"/><rect x="99" y="48" width="15" height="100" fill="#c7b898" stroke="#b49f85" stroke-width=".35"/><circle cx="71" cy="110" r="20" fill="#f5edda" stroke="#b7955c" stroke-width=".75"/><path d="M71 124q-9-35 0-38M71 101l-14-9M72 111l16-13M71 93l5-8" stroke="#5b6e5a" stroke-width=".85" fill="none"/><rect x="47" y="145" width="60" height="15" rx=".7" fill="#f8ecd4" stroke="#a98a72" stroke-width=".5"/><text x="77" y="154.8" text-anchor="middle" font-family="Georgia,serif" font-size="4.5" fill="#77624a">Pour toi</text><text x="137" y="38" font-family="Georgia,serif" font-size="5" fill="#6b685b">Découpes</text><text x="137" y="47" font-family="Arial,sans-serif" font-size="3.8" fill="#66645c">Base : 21 × 15 cm</text><text x="137" y="54" font-family="Arial,sans-serif" font-size="3.8" fill="#66645c">Pli : 10,5 cm</text><text x="137" y="63" font-family="Arial,sans-serif" font-size="3.8" fill="#66645c">Panneau : 9,5 × 14</text><text x="137" y="71" font-family="Arial,sans-serif" font-size="3.8" fill="#66645c">Motif : 8,1 × 5,2</text><text x="137" y="79" font-family="Arial,sans-serif" font-size="3.8" fill="#66645c">Bande : 1,5 × 10</text><text x="137" y="87" font-family="Arial,sans-seri