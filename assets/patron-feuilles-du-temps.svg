<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-label="Patron mini album Les feuilles du temps, page 12 sur 16 centimètres avec deux perforations et pochette"><rect width="210" height="297" fill="#faf8f1"/><text x="20" y="11" font-family="Georgia,serif" font-size="5.8" fill="#594f3f">L’Atelier des Papiers · Les feuilles du temps</text><text x="20" y="17" font-family="Arial,sans-serif" font-size="3.5" fill="#75685c">GABARIT 1:1 • Imprimer à 100 %, sans « adapter à la page »</text><rect x="35" y="23" width="120" height="160" fill="#f2e6d6" stroke="#9b816a" stroke-width=".55"/><text x="95" y="37" text-anchor="middle" font-family="Georgia,serif" font-size="5.5" fill="#5d5141">Page / couverture · 12 × 16 cm</text><text x="95" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="3.4" fill="#796f64">Découper 4 pages + 2 couvertures</text><g stroke="#99785e" fill="none" stroke-width=".4"><circle cx="50" cy="53" r="2.5"/><circle cx="50" cy="153" r="2.5"/></g><path d="M50 53h28M50 153h28" stroke="#d0a782" stroke-dasharray="1,1" stroke-width=".35"/><text x="80" y="54.2" font-family="Arial,sans-serif" font-size="3.8" fill="#735f50">Perforations Ø 5 mm</text><text x="80" y="58" font-family="Arial,sans-serif" font-size="3.5" fill="#735f50">x = 15 mm du bord gauche</text><text x="80" y="62" font-family="Arial,sans-serif" font-size="3.5" fill="#735f50">y = 30 et 130 mm du haut</text><rect x="35" y="198" width="85" height="55" fill="#e3c5a5" stroke="#95775f" stroke-width=".55"/><text x="77.5" y="215" text-anchor="middle" font-family="Georgia,serif" font-size="4.3" fill="#594735">Pochette 8,5 × 5,5 cm</text><path d="M35 198V253H120V198" stroke="#b36e52" stroke-width="1.2" fill="none"/><text x="77.5" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="3.3" fill="#594735">Coller sur 3 bords</text><text x="77.5" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="3.3" fill="