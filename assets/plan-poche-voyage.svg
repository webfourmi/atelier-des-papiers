<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="0 0 210 148"><rect width="210" height="148" fill="#fffdf8"/><g font-family="DejaVu Sans, sans-serif" fill="#393d36"><text x="15" y="16" font-size="6">Poche à trois languettes</text><text x="15" y="26" font-size="3.6">Pièce 10 × 6 cm ; face 8 × 5 cm. Schéma technique.</text><rect x="55" y="44" width="100" height="60" fill="#e6d1b2" stroke="#697967" stroke-width=".5"/><g stroke="#697967" stroke-width=".4" stroke-dasharray="2 1"><path d="M65 44v60M145 44v60M55 94h100"/></g><g fill="#ddd5c7" stroke="#697967" stroke-width=".3"><rect x="55" y="94" width="10" height="10"/><rect x="145" y="94" width="10" height="10"/><path d="M55 94l10 10m-10 0l10-10M145 94l10 10m-10 0l10-10"/></g><text x="84" y="40" font-size="3.5">HAUT OUVERT</text><text x="87" y="70" font-size="4">Face 8 × 5 cm</text><text x="15" y="118" font-size="3.6">1. Retirer les deux carrés hachurés. 2. Replier les languettes au dos.</text><text x="15" y="128" font-size="3.6">3. Coller uniquement ces trois languettes. Laisser le haut libre.</text><text x="15" y="139" font-size="3.2">Gabarit à 100 % disponible dans le patron PDF du carnet.</text></g></svg>