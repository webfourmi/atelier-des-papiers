<text x="359" y="232" font-size="23" font-family="Georgia" fill="#6a523f">Format terminé : 7 × 12 cm</text>
<text x="359" y="267" font-size="18" fill="#65564a" font-family="Arial">Deux coins coupés à 10 × 10 mm</text>
<text x="359" y="298" font-size="18" fill="#65564a" font-family="Arial">Trou Ø 5 mm : axe central</text>
<text x="359" y="327" font-size="18" fill="#65564a" font-family="Arial">à 10 mm du bord supérieur</text>
<text x="359" y="368" font-size="17" font-family="Arial" fill="#88684b">Le patron PDF séparé est à 100 %.</text>
<text x="55" y="454" font-size="27" font-family="Georgia" fill="#6d785e">La méthode en neuf gestes</text>
<g transform="translate(58 488)"><circle cx="13" cy="0" r="14" fill="#a17c5b"/><text x="13" y="5" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">1</text><text x="40" y="6" font-size="19" font-family="Arial" fill="#5b4b3b">Préparer les encres et le papier</text></g><g transform="translate(58 532)"><circle cx="13" cy="0" r="14" fill="#81917b"/><text x="13" y="5" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">2</text><text x="40" y="6" font-size="19" font-family="Arial" fill="#5b4b3b">Tracer le format 70 × 120 mm</text></g><g transform="translate(58 576)"><circle cx="13" cy="0" r="14" fill="#a17c5b"/><text x="13" y="5" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">3</text><text x="40" y="6" font-size="19" font-family="Arial" fill="#5b4b3b">Découper les deux biseaux</text></g><g transform="translate(58 620)"><circle cx="13" cy="0" r="14" fill="#81917b"/><text x="13" y="5" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">4</text><text x="40" y="6" font-size="19" font-family="Arial" fill="#5b4b3b">Percer le trou Ø 5 mm</text></g><g transform="translate(58 664)"><circle cx="13" cy="0" r="14" fill="#a17c5b"/><text x="13" y="5" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">5</text><text x="40" y="6" font-size="19" font-family="Arial" fill="#5b4b3b">Estomper la teinte claire</text></g><g transform="translate(58 708)"><circle cx="13" cy="0" r="14" fill="#81917b"/><text x="13" y="5" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">6</text><text x="40" y="6" font-size="19" font-family="Arial" fill="#5b4b3b">Patiner les quatre bords</text></g><g transform="translate(58 752)"><circle cx="13" cy="0" r="14" fill="#a17c5b"/><text x="13" y="5" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">7</text><text x="40" y="6" font-size="19" font-family="Arial" fill="#5b4b3b">Déposer de petites gouttes d’eau</text></g><g transform="translate(58 796)"><circle cx="13" cy="0" r="14" fill="#81917b"/><text x="13" y="5" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">8</text><text x="40" y="6" font-size="19" font-family="Arial" fill="#5b4b3b">Tamponner quand le fond est sec</text></g><g transform="translate(58 840)"><circle cx="13" cy="0" r="14" fill="#a17c5b"/><text x="13" y="5" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">9</text><text x="40" y="6" font-size="19" font-family="Arial" fill="#5b4b3b">Nouer une ficelle, photographier</text></g>
<line x1="53" y1="911" x2="741" y2="911" stroke="#c3aa90" stroke-width="2"/>
<text x="55" y="949" font-size="24" font-family="Georgia" fill="#6d785e">À retenir</text>
<text x="55" y="981" font-size="17" font-family="Arial" fill="#605447">• Commencer l’encrage sur un brouillon, puis entrer sur le tag.</text>
<text x="55" y="1009" font-size="17" font-family="Arial" fill="#605447">• Tamponner l’eau délicatement, puis laisser sécher totalement.</text>
<text x="55" y="1037" font-size="17" font-family="Arial" fill="#605447">• Utiliser une encre de contour permanente une fois sèche.</text>
<text x="55" y="1072" font-size="15" font-family="Arial" fill="#887766">Schéma de démonstration non à l’échelle · Patron 1:1 disponible dans le projet.</text>
