<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="#fffdf8"/><g font-family="DejaVu Sans, sans-serif" fill="#393d36"><text x="15" y="17" font-size="4">L'ATELIER DES PAPIERS</text><text x="15" y="30" font-size="7">Le jardin oublié</text><text x="15" y="39" font-size="3.5">Plan réduit d'une double page A5 : environ 29,6 × 21 cm.</text>
<rect x="15" y="50" width="180" height="128" fill="#f4ead8" stroke="#697967" stroke-width=".5"/><path d="M105 50v128" stroke="#697967" stroke-width=".5"/><rect x="99" y="50" width="12" height="128" fill="#fffdf8" stroke="#c6beb1" stroke-width=".3" stroke-dasharray="2 1"/>
<g stroke="#9d8d76" stroke-width=".3"><rect x="22" y="121" width="35" height="44" fill="#d8c29c"/><rect x="34" y="112" width="34" height="44" fill="#dde0c7"/><rect x="26" y="155" width="35" height="10" fill="#fffdf8"/><rect x="148" y="59" width="39" height="37" fill="#d8c29c"/><rect x="140" y="73" width="34" height="35" fill="#dde0c7"/><rect x="149" y="100" width="31" height="10" fill="#fffdf8"/></g>
<g font-size="3.5"><text x="22" y="172">Groupe principal</text><text x="133" y="118">Groupe secondaire</text><text x="45" y="90">Zone libre</text><text x="127" y="154">Zone libre</text><text x="15" y="189">Au pli : environ 1 cm libre de chaque côté.</text><text x="15" y="200">Fragments conseillés : de 4 × 6 à 7 × 10 cm.</text><text x="15" y="211">Étiquettes : environ 5 × 2 cm. Aucun élément rigide au pli.</text></g>
<g font-size="3.6"><text x="15" y="229">ORDRE DES COUCHES</text><text x="15" y="240">1. Fonds texte / carte collés ; laisser sécher.</text><text x="15" y="250">2. Voile de gesso ; séchage complet selon la notice.</text><text x="15" y="260">3. Tampons, puis découpes botaniques et étiquettes.</text><text x="15" y="270">4. Écriture ; laisser sécher avant de refermer.</text><text x="15" y="284">Disposition indicative : adapter les papiers à ton carnet.</text></g></g></svg>